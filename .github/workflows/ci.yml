name: CI/CD Pipeline - Promo Manager KF

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Lint & Unit Tests
  # ============================================================================
  lint-and-test:
    name: "1. Lint & Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "Install Monorepo Dependencies"
        run: npm ci

      - name: "Type Check & Linting"
        run: |
          echo "Verifying TypeScript types across backend and frontend..."
          npm --workspace=backend run lint
          npm --workspace=frontend exec -- tsc --noEmit

      - name: "Run Unit Tests (Vitest)"
        run: |
          echo "Executing domain and service unit tests..."
          npm run test

  # ============================================================================
  # Stage 2: Docker Images Build
  # ============================================================================
  build-docker:
    name: "2. Build Docker Images"
    needs: [lint-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: actions/setup-buildx-action@v3

      - name: "Build Backend Docker Image"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: promo-backend:ci

      - name: "Build Frontend Docker Image"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=http://localhost:4000
          push: false
          tags: promo-frontend:ci

  # ============================================================================
  # Stage 3: Integration Smoke Test (Docker Compose + GET /health)
  # ============================================================================
  smoke-test:
    name: "3. Integration Smoke Test"
    needs: [build-docker]
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'ci_postgres' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_secure_pass_123' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'promo_ci_db' }}
      POSTGRES_PORT: 5433
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Validate Environment Variables"
        run: |
          echo "Verifying required environment variables are set..."
          if [ -z "$POSTGRES_USER" ] || [ -z "$POSTGRES_PASSWORD" ] || [ -z "$POSTGRES_DB" ]; then
            echo "Error: Required database secrets or environment variables are missing!"
            exit 1
          fi
          echo "All required environment variables verified."

      - name: "Generate Temporary .env File"
        run: |
          cat <<EOF > .env
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_PORT=${POSTGRES_PORT}
          PORT=${PORT}
          NODE_ENV=${NODE_ENV}
          DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
          CORS_ORIGIN=${CORS_ORIGIN}
          VITE_API_URL=http://localhost:4000
          EOF

      - name: "Start Services with Docker Compose"
        run: |
          echo "Starting containers in detached mode..."
          docker compose up -d --build

      - name: "Wait for Containers to be Ready"
        run: |
          echo "Waiting for services and PostgreSQL database to initialize..."
          MAX_RETRIES=30
          COUNT=0
          
          while [ $COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || echo "000")
            echo "Attempt $((COUNT+1))/$MAX_RETRIES - Healthcheck response: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Backend and Database are healthy and responding 200 OK!"
              break
            fi
            
            COUNT=$((COUNT+1))
            sleep 2
          done
          
          if [ $COUNT -ge $MAX_RETRIES ]; then
            echo "Timeout waiting for /health endpoint."
            docker compose logs
            exit 1
          fi

      - name: "Smoke Test - Assert Health Status and DB Connectivity"
        run: |
          echo "Performing detailed assertion against GET /health..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" http://localhost:4000/health)
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS_CODE=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "HTTP Status Code: $STATUS_CODE"
          echo "Response Body: $BODY"
          
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed! Expected status 200, got $STATUS_CODE"
            docker compose logs
            exit 1
          fi
          
          # Check JSON body content
          if [[ "$BODY" != *"\"status\":\"ok\""* ]] || [[ "$BODY" != *"\"db\":\"connected\""* ]]; then
            echo "Smoke test failed! Body does not indicate healthy database connection."
            docker compose logs
            exit 1
          fi
          
          echo "Smoke test passed successfully! Application and DB are 100% operational."

      - name: "Teardown Docker Compose"
        if: always()
        run: |
          echo "Cleaning up containers and volumes..."
          docker compose down -v --remove-orphans
